<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mon profil — RaceHub</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="top-strip"></div>
    <div id="navbar-root"></div>

    <main id="profile-page">
      <div class="spinner"></div>
    </main>

    <footer>
      <div class="footer-logo">RACE<span class="accent">HUB</span></div>
    </footer>

    <!-- Modale formulaire générique -->
    <div class="modal-backdrop" id="form-modal">
      <div class="modal" style="position:relative">
        <button class="modal-close" onclick="closeFormModal()">×</button>
        <div id="form-modal-content"></div>
      </div>
    </div>

    <div id="toast-root"></div>

    <script src="/js/api.js"></script>
    <script src="/js/navbar.js"></script>
    <script src="/js/profile.js"></script>
  </body>
</html>
